spring.application.name=joao-de-menezes-portifolio

# Configuração com fallback para o ambiente local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meu_portifolio_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Configurações opcionais, mas recomendadas do JPA/Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true